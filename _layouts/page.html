---
layout: default
---
{% assign lang = page.lang | default: "fr" %}
<div class="page-wrap">
  <a class="back-link" href="{% if lang == 'en' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">
    &larr; {% if lang == "en" %}Back to index{% else %}Retour au sommaire{% endif %}
  </a>
  <h1>{{ page.title }}</h1>
  <div class="entry-content">
    {{ content }}
  </div>
</div>
