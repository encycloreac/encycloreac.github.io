<!DOCTYPE html>
<html lang="fr-FR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
{% if page.lang == "en" %}
  {% assign site_name = site.title_en | default: site.title %}
{% else %}
  {% assign site_name = site.title %}
{% endif %}
<title>{% if page.title %}{{ page.title }} — {{ site_name }}{% else %}{{ site_name }}{% endif %}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
{{ content }}
</body>
</html>
